[project]
name = "primitive-db"
version = "0.1.0"
description = "Учебная консольная база данных с хранением в JSON"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["prettytable>=3.12,<4", "prompt>=0.4,<0.5"]

[dependency-groups]
dev = ["ruff>=0.13.3"]

[project.scripts]
project = "primitive_db.main:main"
database = "primitive_db.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/primitive_db"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
